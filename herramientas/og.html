<!doctype html>
<html lang="es-PA">
<head>
<meta charset="utf-8" />
<!-- Imagen para compartir (1200×630): la arma herramientas/og-soluciones.mjs. A la derecha va algo real, nunca una foto
     generada: los avisos de ejemplo (como en el héroe de la portada) o la pantalla de la demo de ese negocio. -->
<link rel="stylesheet" href="../assets/atk.css" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0f2c29; color: #f7f5ef; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 48px; padding: 64px 64px 64px 72px; }
  .og__texto { display: grid; gap: 28px; align-content: center; }
  .og__texto img.logo { height: 40px; width: auto; }
  h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 3.4rem; line-height: 1.04; letter-spacing: -0.025em; color: #f7f5ef; margin: 0; text-wrap: balance; }
  h1 .modulo { display: inline-block; width: 0.2em; height: 0.2em; margin-left: 0.07em; background: #f2b544; border-radius: 0.03em; }
  p { margin: 0; font-family: "Inter", sans-serif; font-size: 1.3rem; line-height: 1.4; color: #c3d3cf; }
  /* avisos */
  .avisos { box-sizing: border-box; padding: 16px 14px 18px; border-radius: 28px; background: #0a1f1c; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08), 0 30px 60px -24px rgb(0 0 0 / 0.7); display: grid; gap: 10px; }
  .avisos__cabeza { font-family: "Inter", sans-serif; font-size: 15px; color: #c3d3cf; margin: 2px 6px 4px; }
  .aviso { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; background: #f7f5ef; color: #202729; font-family: "Inter", sans-serif; }
  .aviso__icono { width: 44px; height: 44px; border-radius: 12px; background: #176b64; color: #f7f5ef; display: grid; place-items: center; }
  .aviso__icono svg { width: 24px; height: 24px; fill: currentColor; }
  .aviso__cabeza { display: flex; justify-content: space-between; font-size: 15px; color: #5b6466; }
  .aviso__cabeza strong { color: #202729; font-weight: 750; }
  .aviso__texto { font-size: 19px; line-height: 1.3; margin-top: 2px; }
  /* foto del héroe de la portada: su fondo es el mismo verde, va sin marco */
  .heroe-foto { display: block; width: 520px; height: 520px; margin: -20px 0 -20px auto; }
  /* pantalla de una demo */
  .pantalla { border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 10px #15181b, 0 40px 70px -24px rgb(0 0 0 / 0.75); background: #15181b; }
  .pantalla img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="og">
  <div class="og__texto">
    <img class="logo" src="../assets/marca/logo-oscuro.svg" alt="" />
    <h1>Hacemos la tecnología de tu negocio y la instalamos en tu local<span class="modulo"></span></h1>
    <p>Software, apps, inteligencia artificial y equipos instalados para negocios de Panamá.</p>
  </div>
  <div class="og__lado"></div>
</div>
</body>
</html>
