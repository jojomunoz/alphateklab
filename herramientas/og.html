<!doctype html>
<html lang="es-PA">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/atk.css" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f4f5f2; color: #15171b; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px; display: grid; grid-template-rows: auto 1fr auto; gap: 28px; }
  .og .marca { font-size: 2rem; }
  h1 { font-size: 3.7rem; font-variation-settings: "wdth" 118; font-stretch: 118%; font-weight: 820; line-height: 1.02; max-width: 21ch; align-self: center; }
  .og__tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .og__tags .etiqueta { font-size: 1.05rem; }
</style>
</head>
<body>
<div class="og">
  <span class="marca">alphatek<span class="marca__lab">lab</span></span>
  <h1>Software, pantallas, cámaras y sensores para negocios en Panamá</h1>
  <div class="og__tags">
    <span class="etiqueta">Menú QR</span><span class="etiqueta">Pedir y pagar en la mesa</span><span class="etiqueta">Agente de citas</span><span class="etiqueta">Recorrido 3D</span><span class="etiqueta">Contador de personas</span><span class="etiqueta etiqueta--hueca">Sensores IoT</span>
  </div>
</div>
</body>
</html>
