<!doctype html>
<html lang="es-PA">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/atk.css" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #202729; color: #f7f5ef; }
  .og { box-sizing: border-box; width: 1200px; height: 630px; display: grid; grid-template-columns: 1.05fr 1fr; }
  .og__texto { padding: 64px 56px 56px 72px; display: grid; grid-template-rows: auto 1fr auto; gap: 24px; }
  .og__texto img.logo { height: 44px; width: auto; }
  h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 3.6rem; line-height: 1.04; letter-spacing: -0.025em; color: #f7f5ef; align-self: center; margin: 0; }
  p { margin: 0; font-family: "Inter", sans-serif; font-size: 1.35rem; color: #c3cbc8; }
  .og__foto { position: relative; }
  .og__foto img { width: 100%; height: 100%; object-fit: cover; }
  .og__foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #202729 0%, transparent 18%); }
  .barra { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #f2b544; }
</style>
</head>
<body>
<div class="og">
  <div class="og__texto">
    <img class="logo" src="../assets/marca/logo-oscuro.svg" alt="" />
    <h1>Tecnología para tu negocio. La hacemos y la instalamos.</h1>
    <p>Software, apps, IA, cámaras, sensores y QR para negocios en Panamá.</p>
  </div>
  <div class="og__foto"><img src="../assets/fotos/marca-heroe.webp" alt="" /></div>
</div>
<div class="barra"></div>
</body>
</html>
